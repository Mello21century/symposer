name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      - run: go vet ./... && go build -o bin/symposer${{ runner.os == 'Windows' && '.exe' || '' }} .
      - run: e2e/run.sh bin/symposer${{ runner.os == 'Windows' && '.exe' || '' }}
        env:
          E2E_LARAVEL: '1'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross-compile
        run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=$([ "$os" = windows ] && echo .exe || true)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/symposer-$os-$arch$ext" .
          done
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
