name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.4']
        include:  # shim must stay PHP 7.2.5-compatible (Composer 2.11's floor)
          - { os: ubuntu-latest, php: '7.2' }
          - { os: ubuntu-latest, php: '7.4' }
          - { os: ubuntu-latest, php: '8.0' }
    name: e2e (${{ matrix.os }}, php ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable  # go.mod's 1.22 floor builds macOS binaries without LC_UUID, which dyld rejects
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, mbstring, pdo_sqlite, zip  # Laravel's needs; Windows PHP lacks fileinfo by default
          tools: none
      - run: go vet ./... && go build -o bin/symposer${{ runner.os == 'Windows' && '.exe' || '' }} .
      - run: e2e/run.sh bin/symposer${{ runner.os == 'Windows' && '.exe' || '' }}
        env:
          E2E_LARAVEL: ${{ matrix.php == '8.4' && '1' || '' }}  # Laravel 13 needs PHP 8.3+

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable  # go.mod's 1.22 floor builds macOS binaries without LC_UUID, which dyld rejects
      - name: cross-compile
        run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=$([ "$os" = windows ] && echo .exe || true)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/symposer-$os-$arch$ext" .
          done
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
